name: G2G Fiyat Tarayıcı ve Discord Bildirici

on:
  schedule:
    # UTC saatiyle her 3 saatte bir otomatik çalışır
    - cron: '0 */3 * * *'
  workflow_dispatch: # İstediğin zaman GitHub paneli üzerinden elle başlatma butonu sunar

jobs:
  scrape_and_notify:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Chrome & Chromium Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Python Bağımlılıklarını Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tarama Kodunu Çalıştır
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py
