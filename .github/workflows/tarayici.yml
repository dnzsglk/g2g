name: G2G Fiyat Tarayıcı ve Discord Bildirici

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  scrape_and_notify:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Chrome & Chromium Kur adımı tamamen kaldırıldı! 
      # GitHub Actions ubuntu-latest imajında Chrome varsayılan olarak yüklüdür.

      - name: Python Bağımlılıklarını Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tarama Kodunu Çalıştır
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py
