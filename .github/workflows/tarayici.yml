name: G2G Fiyat Tarayıcı ve Discord Bildirici

on:
  schedule:
    # Her 15 dakikada bir çalışır
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scrape_and_notify:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v3

      - name: Python Kur ve Pip Önbelleğini (Cache) Aç
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Python Bağımlılıklarını Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tarama Kodunu Çalıştır
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py
